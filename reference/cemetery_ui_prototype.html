<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cemetery Management System - UI Prototype (Web & Mobile)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#F2F7F5',
              100: '#E1EDE9',
              600: '#2D6A5D',
              700: '#24594D',
              800: '#1C453C',
              900: '#13302A'
            },
            surface: '#F7F8F5',
            ink: '#1F2933'
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .phone-mockup {
      width: 390px;
      height: 800px;
      border-radius: 44px;
      box-shadow: 0 25px 60px -15px rgba(0,0,0,0.3), 0 0 0 10px #1E293B, 0 0 0 12px #475569;
      position: relative;
      overflow: hidden;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex flex-col">

  <!-- ================= TOP CONTROL TOOLBAR ================= -->
  <header class="bg-slate-950 text-white px-6 py-3 border-b border-slate-800 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50 shadow-md">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center font-bold text-white shadow-inner">
        CMS
      </div>
      <div>
        <h1 class="font-bold text-base tracking-wide flex items-center gap-2">
          Hệ Thống Quản Lý Nghĩa Trang
          <span class="text-xs px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-700">Bản Trực Quan 2026</span>
        </h1>
        <p class="text-xs text-slate-400">Xem trước luồng giao diện Web & Ứng dụng Di động theo Actor</p>
      </div>
    </div>

    <!-- Mode & Actor Controls -->
    <div class="flex items-center gap-3 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
      <!-- Device Switcher -->
      <div class="flex bg-slate-800 p-1 rounded-lg">
        <button id="btn-device-web" onclick="switchDevice('web')" class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold rounded-md bg-emerald-600 text-white transition-all shadow">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          Giao diện Web Desktop
        </button>
        <button id="btn-device-mobile" onclick="switchDevice('mobile')" class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold rounded-md text-slate-300 hover:text-white transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
          Giao diện Mobile App
        </button>
      </div>

      <div class="h-6 w-px bg-slate-700"></div>

      <!-- Actor Switcher -->
      <div class="flex items-center gap-1.5 text-xs">
        <span class="text-slate-400 font-medium">Actor:</span>
        <select id="actor-select" onchange="switchActor(this.value)" class="bg-slate-800 text-white font-medium px-3 py-1.5 rounded-lg border border-slate-700 focus:outline-none focus:border-emerald-500">
          <option value="public">1. Khách hàng / Thân nhân (Public Zero-PII)</option>
          <option value="marketing">2. Nhân viên Marketing (Hợp đồng & Giấy báo tử)</option>
          <option value="caretaker" selected>3. Quản trang (Hiện trường & Kim Tĩnh)</option>
          <option value="accountant">4. Kế toán (Công nợ XOR & VietQR)</option>
          <option value="admin">5. Sếp / Ban Quản trị (GIS & KPI)</option>
        </select>
      </div>
    </div>
  </header>

  <!-- ================= MAIN VIEWPORT CONTAINER ================= -->
  <main class="flex-1 flex justify-center items-start p-4 md:p-8 overflow-y-auto">

    <!-- DESKTOP WEB CONTAINER -->
    <div id="view-web" class="w-full max-w-7xl bg-surface rounded-2xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col min-h-[750px]">
      <!-- Web Shell Header -->
      <nav class="bg-brand-700 text-white px-6 py-3 flex items-center justify-between border-b border-brand-800">
        <div class="flex items-center gap-6">
          <div class="flex items-center gap-2 font-bold text-lg tracking-wide">
            <span class="w-7 h-7 rounded bg-brand-600 flex items-center justify-center text-sm shadow-inner">🏛️</span>
            Công Viên Nghĩa Trang Vĩnh Hằng
          </div>
          <div id="web-nav-links" class="hidden md:flex items-center gap-2 text-sm text-brand-100">
            <!-- Nav links generated dynamically -->
          </div>
        </div>
        <div class="flex items-center gap-3">
          <span id="web-user-badge" class="text-xs px-2.5 py-1 rounded-full bg-brand-800 text-emerald-200 border border-brand-600">
            Đang truy cập: Quản trang
          </span>
          <button class="text-xs bg-slate-900/40 hover:bg-slate-900/60 px-3 py-1.5 rounded text-white transition">Thoát</button>
        </div>
      </nav>

      <!-- Web Body Content -->
      <div id="web-content" class="p-6 flex-1 overflow-y-auto custom-scrollbar">
        <!-- Content will be injected by JavaScript -->
      </div>
    </div>

    <!-- MOBILE PHONE CONTAINER (HIDDEN INITIALLY) -->
    <div id="view-mobile" class="hidden flex-col items-center">
      <div class="text-slate-400 text-xs mb-3 flex items-center gap-2">
        <span>Khung mô phỏng điện thoại di động thông minh (390 x 800)</span>
      </div>
      <div class="phone-mockup bg-surface flex flex-col">
        <!-- Phone Dynamic Island / Speaker -->
        <div class="bg-slate-950 text-white px-7 pt-3 pb-2 flex justify-between items-center text-xs select-none">
          <span class="font-semibold text-xs">09:41</span>
          <div class="w-24 h-4 bg-black rounded-full mx-auto"></div>
          <div class="flex items-center gap-1.5">
            <span class="text-[10px]">5G</span>
            <div class="w-4 h-2.5 border border-white rounded-sm p-0.5"><div class="h-full bg-white w-3/4"></div></div>
          </div>
        </div>

        <!-- Phone App Bar -->
        <div class="bg-brand-700 text-white px-4 py-3 flex items-center justify-between shadow">
          <div class="flex items-center gap-2">
            <span class="text-base font-bold tracking-tight" id="mobile-appbar-title">Quản Trang Thực Địa</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="text-[11px] text-emerald-100" id="mobile-role-label">Hiện trường</span>
          </div>
        </div>

        <!-- Phone Screen Body -->
        <div id="mobile-content" class="flex-1 overflow-y-auto p-4 custom-scrollbar bg-slate-50 text-slate-800">
          <!-- Dynamic mobile screen content -->
        </div>

        <!-- Phone Bottom Navigation Bar -->
        <div id="mobile-bottom-nav" class="bg-white border-t border-slate-200 px-3 py-2 flex justify-around items-center text-[10px] text-slate-500 select-none">
          <!-- Dynamic navigation items -->
        </div>
      </div>
    </div>

  </main>

  <!-- ================= JAVASCRIPT TEMPLATES & LOGIC ================= -->
  <script>
    let currentDevice = 'web';
    let currentActor = 'caretaker';

    function switchDevice(device) {
      currentDevice = device;
      const webView = document.getElementById('view-web');
      const mobileView = document.getElementById('view-mobile');
      const btnWeb = document.getElementById('btn-device-web');
      const btnMobile = document.getElementById('btn-device-mobile');

      if (device === 'web') {
        webView.classList.remove('hidden');
        mobileView.classList.add('hidden');
        btnWeb.className = "flex items-center gap-2 px-3 py-1.5 text-xs font-semibold rounded-md bg-emerald-600 text-white transition-all shadow";
        btnMobile.className = "flex items-center gap-2 px-3 py-1.5 text-xs font-semibold rounded-md text-slate-300 hover:text-white transition-all";
      } else {
        webView.classList.add('hidden');
        mobileView.classList.remove('hidden');
        btnMobile.className = "flex items-center gap-2 px-3 py-1.5 text-xs font-semibold rounded-md bg-emerald-600 text-white transition-all shadow";
        btnWeb.className = "flex items-center gap-2 px-3 py-1.5 text-xs font-semibold rounded-md text-slate-300 hover:text-white transition-all";
      }
      render();
    }

    function switchActor(actor) {
      currentActor = actor;
      document.getElementById('actor-select').value = actor;
      render();
    }

    // ================= DATA & UI RENDERERS =================
    function render() {
      renderWeb();
      renderMobile();
    }

    // 1. WEB RENDERER
    function renderWeb() {
      const container = document.getElementById('web-content');
      const navLinks = document.getElementById('web-nav-links');
      const badge = document.getElementById('web-user-badge');

      // Update badge
      const roleMap = {
        public: 'Khách vãng lai (Cổng Công Cộng)',
        marketing: 'Nhân viên Marketing (Kinh doanh)',
        caretaker: 'Quản trang (Vận hành hiện trường)',
        accountant: 'Kế toán viên (Tài chính)',
        admin: 'Sếp / Ban Giám Đốc (Quản trị)'
      };
      badge.textContent = `Actor: ${roleMap[currentActor]}`;

      if (currentActor === 'public') {
        navLinks.innerHTML = `
          <a class="px-2.5 py-1 rounded bg-brand-800 text-white font-medium text-xs">Tra Cứu Phần Mộ</a>
          <a class="px-2.5 py-1 rounded hover:bg-brand-600 text-brand-100 text-xs">Quy Định Thăm Viếng</a>
          <a class="px-2.5 py-1 rounded hover:bg-brand-600 text-brand-100 text-xs">Liên Hệ Ban Quản Trang</a>
        `;
        container.innerHTML = `
          <!-- P01 & P02 PUBLIC MEMORIAL SEARCH -->
          <div class="max-w-4xl mx-auto space-y-6">
            <div class="text-center space-y-2 py-6 border-b border-slate-200">
              <span class="text-xs font-semibold uppercase tracking-widest text-brand-700 bg-brand-50 px-3 py-1 rounded-full border border-brand-100">Cổng Thông Tin Tưởng Niệm (Zero-PII)</span>
              <h2 class="text-2xl font-bold text-slate-900">Tra Cứu Vị Trí Phần Mộ & Hướng Dẫn Thăm Viếng</h2>
              <p class="text-sm text-slate-500">Bảo mật tuyệt đối thông tin thân nhân, số điện thoại và hợp đồng kinh tế theo quy định.</p>
            </div>

            <!-- Search Card -->
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div class="md:col-span-2">
                  <label class="block text-xs font-semibold text-slate-600 mb-1">Họ tên người quá cố hoặc Mã ô mộ</label>
                  <input type="text" value="Trần Thị Mai" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-700 focus:outline-none" placeholder="Ví dụ: Nguyễn Văn A hoặc A-H01-05">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">Khu vực an táng</label>
                  <select class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white">
                    <option>Tất cả phân khu</option>
                    <option selected>Khu A - Đồi Thông</option>
                    <option>Khu B - Vĩnh Hằng</option>
                    <option>Khu VIP - Gia Tộc</option>
                  </select>
                </div>
              </div>
              <div class="flex justify-between items-center pt-2">
                <span class="text-xs text-slate-400">Tìm thấy 01 kết quả phù hợp (Độ chính xác năm sinh: Khớp năm)</span>
                <button class="bg-brand-700 hover:bg-brand-800 text-white text-sm font-semibold px-5 py-2 rounded-lg shadow transition">Tìm Kiếm Phần Mộ</button>
              </div>
            </div>

            <!-- P03 RESULT CARD -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
              <div class="bg-brand-50 border-b border-brand-100 px-5 py-3 flex justify-between items-center">
                <div class="flex items-center gap-2">
                  <span class="text-lg">🕯️</span>
                  <span class="font-bold text-slate-800 text-sm">Hồ Sơ Tưởng Niệm: Cụ Bà TRẦN THỊ MAI</span>
                </div>
                <span class="text-xs px-2.5 py-0.5 rounded bg-emerald-100 text-emerald-800 font-medium">Mộ Đã An Táng</span>
              </div>
              <div class="p-5 grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="space-y-2 text-sm border-r border-slate-100 pr-4">
                  <div class="flex justify-between text-xs py-1 border-b border-slate-100">
                    <span class="text-slate-500">Năm sinh - Năm mất:</span>
                    <span class="font-semibold text-slate-800">1945 - 2024 (Hưởng thọ 79 tuổi)</span>
                  </div>
                  <div class="flex justify-between text-xs py-1 border-b border-slate-100">
                    <span class="text-slate-500">Quê quán:</span>
                    <span class="font-semibold text-slate-800">Nam Định</span>
                  </div>
                  <div class="flex justify-between text-xs py-1 border-b border-slate-100">
                    <span class="text-slate-500">Vị trí mộ:</span>
                    <span class="font-bold text-brand-700">Khu A • Hàng 02 • Ô số 08</span>
                  </div>
                  <div class="flex justify-between text-xs py-1">
                    <span class="text-slate-500">Huyệt vị (Slot):</span>
                    <span class="font-semibold text-slate-800">Slot 1/1 (Mộ đơn tiêu chuẩn)</span>
                  </div>
                </div>

                <!-- GPS & Directions -->
                <div class="space-y-3">
                  <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Định Vị & Dẫn Đường GPS</h4>
                  <div class="bg-slate-100 rounded-lg p-3 text-xs space-y-1">
                    <p class="text-slate-600">Tọa độ thực địa: <strong class="text-slate-800">10.762622, 106.660172</strong></p>
                    <p class="text-slate-500">Trạng thái: <span class="text-emerald-600 font-semibold">Tọa độ đã xác minh</span></p>
                    <p class="text-[11px] text-slate-400">Đường đi: Cổng 1 -> Trục Đại Lộ Vĩnh Hằng -> Rẽ trái Hàng 02 -> Cách ngã tư 25m.</p>
                  </div>
                  <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs py-2 rounded-lg flex items-center justify-center gap-1.5 shadow">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    Mở Dẫn Đường Trên Bản Đồ (Google Maps)
                  </button>
                </div>

                <!-- Public Care Results Tab -->
                <div class="space-y-2">
                  <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Kết Quả Chăm Sóc Mộ Công Bố</h4>
                  <div class="border border-slate-200 rounded-lg p-2.5 space-y-2 text-xs">
                    <div class="flex justify-between items-center text-[11px] text-slate-500">
                      <span>Đợt: 01/10/2026</span>
                      <span class="text-emerald-700 font-medium bg-emerald-50 px-1.5 py-0.5 rounded">Đã nghiệm thu</span>
                    </div>
                    <p class="text-slate-700 text-[11px]">Đã hoàn thành: Quét dọn khuôn viên, lau rửa bia đá hoa cương, thắp hương trầm và thay hoa cúc mới.</p>
                    <div class="flex gap-2 pt-1">
                      <div class="w-12 h-12 bg-slate-200 rounded border border-slate-300 flex items-center justify-center text-[9px] text-slate-500">Ảnh bia</div>
                      <div class="w-12 h-12 bg-slate-200 rounded border border-slate-300 flex items-center justify-center text-[9px] text-slate-500">Toàn cảnh</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      else if (currentActor === 'marketing') {
        navLinks.innerHTML = `
          <a class="px-2.5 py-1 rounded bg-brand-800 text-white font-medium text-xs">Bàn Làm Việc</a>
          <a class="px-2.5 py-1 rounded hover:bg-brand-600 text-brand-100 text-xs">Hồ Sơ Khách Hàng</a>
          <a class="px-2.5 py-1 rounded hover:bg-brand-600 text-brand-100 text-xs">Hồ Sơ Người Mất</a>
          <a class="px-2.5 py-1 rounded hover:bg-brand-600 text-brand-100 text-xs">Quản Lý Hợp Đồng</a>
        `;
        container.innerHTML = `
          <!-- M01 & M04 MARKETING WORKSPACE & CONTRACT WIZARD -->
          <div class="space-y-6">
            <!-- Header KPIs -->
            <div class="flex justify-between items-center">
              <div>
                <h2 class="text-xl font-bold text-slate-900">Quản Lý Giao Dịch & Hợp Đồng Pháp Lý</h2>
                <p class="text-xs text-slate-500">Luồng 4 loại hợp đồng: Mua Đất • Cải Táng • Hỏa Táng • Chuyển Nhượng</p>
              </div>
              <div class="flex gap-2">
                <button class="bg-brand-700 hover:bg-brand-800 text-white font-semibold text-xs px-4 py-2 rounded-lg shadow flex items-center gap-1.5">
                  <span>+</span> Lập Hợp Đồng Mới (4 Loại)
                </button>
                <button class="bg-white border border-slate-300 text-slate-700 font-semibold text-xs px-4 py-2 rounded-lg hover:bg-slate-50">
                  + Tiếp Nhận Khách Hàng
                </button>
              </div>
            </div>

            <!-- M04 WIZARD PREVIEW: STEP 3 (CHỌN Ô MỘ & GIỮ CHỖ) -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
              <div class="bg-slate-50 px-5 py-3 border-b border-slate-200 flex justify-between items-center">
                <div class="flex items-center gap-3">
                  <span class="text-xs font-bold bg-brand-700 text-white px-2 py-0.5 rounded">BƯỚC 3 / 4</span>
                  <span class="text-sm font-bold text-slate-800">Soạn Hợp Đồng Mua Đất An Táng (Mã: HD-MD-26-0012)</span>
                </div>
                <span class="text-xs text-slate-500">Khách hàng: <strong>Nguyễn Văn Chung (CCCD: 079085001234)</strong></span>
              </div>

              <div class="p-5 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3 bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs">
                  <div>
                    <label class="text-slate-500 block mb-1">Phân khu chọn</label>
                    <select class="w-full bg-white border border-slate-300 rounded p-1.5 font-medium"><option>Khu A - Đồi Thông (Mộ đơn)</option></select>
                  </div>
                  <div>
                    <label class="text-slate-500 block mb-1">Hàng mộ</label>
                    <select class="w-full bg-white border border-slate-300 rounded p-1.5 font-medium"><option>Hàng 01 (Lô giáp đường)</option></select>
                  </div>
                  <div>
                    <label class="text-slate-500 block mb-1">Đơn giá đất niêm yết (Snapshot)</label>
                    <input type="text" value="40.000.000 đ/m2" readonly class="w-full bg-slate-100 border border-slate-300 rounded p-1.5 font-bold text-brand-700">
                  </div>
                  <div>
                    <label class="text-slate-500 block mb-1">Thời hạn giữ chỗ cọc</label>
                    <input type="text" value="7 ngày (đến 17/10/2026)" readonly class="w-full bg-slate-100 border border-slate-300 rounded p-1.5 text-amber-700 font-semibold">
                  </div>
                </div>

                <!-- Simulation Slot Selector -->
                <div>
                  <h4 class="text-xs font-bold text-slate-700 mb-2">Trạng thái ô đất hàng A-H01:</h4>
                  <div class="grid grid-cols-6 gap-2 text-center text-xs">
                    <div class="p-2.5 rounded-lg border border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed">
                      <p class="font-bold">A-H01-01</p><span class="text-[10px]">Đã có chủ</span>
                    </div>
                    <div class="p-2.5 rounded-lg border border-amber-300 bg-amber-50 text-amber-800">
                      <p class="font-bold">A-H01-02</p><span class="text-[10px]">Đang giữ chỗ</span>
                    </div>
                    <div class="p-2.5 rounded-lg border-2 border-brand-700 bg-brand-50 text-brand-900 font-bold shadow-sm">
                      <p>A-H01-03</p><span class="text-[10px] text-brand-700">✓ Đang Chọn</span>
                    </div>
                    <div class="p-2.5 rounded-lg border border-emerald-300 bg-emerald-50 text-emerald-800 hover:border-brand-600 cursor-pointer">
                      <p class="font-bold">A-H01-04</p><span class="text-[10px]">Trống (Chọn)</span>
                    </div>
                    <div class="p-2.5 rounded-lg border border-red-300 bg-red-50 text-red-700 cursor-not-allowed">
                      <p class="font-bold">A-H01-05</p><span class="text-[10px]">Đã an táng 🔒</span>
                    </div>
                    <div class="p-2.5 rounded-lg border border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed">
                      <p class="font-bold">A-H01-06</p><span class="text-[10px]">Đã có chủ</span>
                    </div>
                  </div>
