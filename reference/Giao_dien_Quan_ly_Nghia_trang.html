const btn=(t,a='',c='',disabled=false)=>`<button type="button" class="btn ${c}" ${disabled?'disabled':''} ${a?`onclick="${esc(a)}"`:''}>${t}</button>`;
const link=(id,t)=>`<a href="#${id}">${t}</a>`;
const b=(t,c='')=>`<span class="badge ${c}">${t}</span>`;
const card=(t,body,action='')=>`<section class="card">${t?`<div class="card-head"><h2>${t}</h2>${action}</div>`:''}${body}</section>`;
const notice=(t,c='')=>`<div class="notice ${c}"><span aria-hidden="true">${c==='red'?'!':c==='amber'?'△':'✓'}</span><p>${t}</p></div>`;
const field=(label,value='',type='text',extra='',hint='')=>`<label class="field"><span>${label}</span><input type="${type}" value="${esc(value)}" ${extra}>${hint?`<small>${hint}</small>`:''}</label>`;
const select=(label,values,extra='')=>`<label class="field"><span>${label}</span><select ${extra}>${values.map(v=>`<option>${v}</option>`).join('')}</select></label>`;
const textarea=(label,val='')=>`<label class="field full"><span>${label}</span><textarea>${val}</textarea></label>`;
const facts=items=>`<div class="facts">${items.map(([k,v])=>`<div><small>${k}</small><strong>${v}</strong></div>`).join('')}</div>`;
const table=(heads,rows)=>`<div class="table-scroll"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="table-foot"><span>${rows.length} bản ghi minh họa</span><span>Trang 1 / 1</span></div>`;
const metric=(name,val,sub)=>`<div class="metric"><span>${name}</span><strong>${val}</strong><small>${sub}</small></div>`;
const steps=(arr,n)=>`<div class="steps">${arr.map((s,i)=>`${i?'<div class="step-line"></div>':''}<div class="step ${i<n?'done':i===n?'current':''}"><b>${i<n?'✓':i+1}</b>${s}</div>`).join('')}</div>`;
const tabs=(items,active,action)=>`<div class="tabs">${items.map(t=>`<button class="tab ${t===active?'active':''}" onclick="${action.replace('$',t)}">${t}</button>`).join('')}</div>`;
const checklist=(items,interactive=false)=>items.map((t,i)=>`<label class="task-row"><input type="checkbox" ${ui.check[i]?'checked':''} ${interactive?`onchange="ui.check[${i}]=this.checked;updateGate()"`:'disabled'}><span class="grow"><p>${t}</p><small>Bắt buộc · ${i===2?'Ảnh sau thực hiện':'Theo nội dung gói đã đăng ký'}</small></span></label>`).join('');
const upload=(type='evidence')=>`<div class="upload"><span class="upload-symbol">↥</span><strong>${type==='scan'?'Đính kèm bản đã ký':'Ảnh xác nhận hiện trường'}</strong><small>${type==='scan'?'PDF, JPG, PNG · Chọn tệp trên thiết bị':'JPG, PNG · Ảnh được giữ trong phiên xem mẫu'}</small><input aria-label="${type==='scan'?'Chọn bản scan':'Chọn ảnh hiện trường'}" type="file" accept="${type==='scan'?'.pdf,.jpg,.jpeg,.png':'image/jpeg,image/png'}" onchange="filePicked(this,'${type}')"><small id="file-status">${(type==='scan'?ui.signed:ui.evidence)?'Đã chọn tệp mẫu trong phiên này':'Chưa chọn tệp'}</small></div>`;
const photo=()=>`<div class="photo-placeholder"><div class="stone"></div><span>Khung ảnh kết quả chăm sóc<br>Minh họa bố cục, không phải ảnh nghiệm thu</span></div>`;
const searchbar=(hint='Tìm theo mã hoặc tên',filters=['Tất cả trạng thái'])=>`<div class="toolbar"><input aria-label="Tìm kiếm" placeholder="${hint}" oninput="filterRows(this.value)"><select aria-label="Lọc trạng thái" onchange="filterRows(this.value==='Tất cả trạng thái'?'':this.value)">${filters.map(x=>`<option>${x}</option>`).join('')}</select></div>`;
const head=(t,d,a='')=>`<div class="pagehead"><div><div class="eyebrow">${ui.id} / ${R[ui.role]||'Thiết kế giao diện'}</div><h1>${t}</h1><p>${d}</p></div>${a?`<div class="actions">${a}</div>`:''}</div>`;
const task=(time,name,sub,status,id)=>`<div class="task-row"><div class="task-no">${time}</div><div class="grow"><p>${link(id,name)}</p><small>${sub}</small></div>${b(status,status==='Đến hạn'?'amber':'')}</div>`;
const map=(interactive=true)=>`<div class="map"><div class="map-top"><strong>KHU A · HÀNG H01–H02</strong><span>Bắc ↑</span></div><div class="map-zone">${Array.from({length:8},(_,i)=>`<button class="plot ${i===3?'selected':i%3===0?'taken':i===5?'held':''}" aria-label="Ô A-H01-0${i+1}" onclick="${interactive?`showPlot('A-H01-0${i+1}')`:'void 0'}">0${i+1}</button>`).join('')}</div><div class="walkway">LỐI ĐI BỘ</div><div class="map-zone">${Array.from({length:8},(_,i)=>`<button class="plot ${i%2===0?'taken':''}" aria-label="Ô A-H02-0${i+1}" onclick="${interactive?`showPlot('A-H02-0${i+1}')`:'void 0'}">0${i+1}</button>`).join('')}</div><div class="map-footer"><span>← Cổng chính</span><span>Sơ đồ minh họa · Không theo tỷ lệ</span></div></div>`;
const contractRows=()=>[
 [contractLink('HĐ-2026-024'),'<strong>Trần Minh Hòa</strong><small>KH-024 · Dữ liệu mẫu</small>','Mua đất','A-H01-06',b('Chờ ký','amber')],
 [contractLink('HĐ-2026-018'),'Trần Minh Hòa','Mua đất','A-H01-04',b('Có hiệu lực')],
 [contractLink('HĐ-2026-022'),'Lê Hoàng Bình','Hỏa táng','Không áp dụng',b('Nháp','gray')]
];
const auditLine=(t,d)=>`<div><strong>${t}</strong><small>${d}</small></div>`;
const confirmBtn=(text,message,next='')=>btn(text,`confirmAction('${text}','${message}','${next}')`,'primary');
const workFacts=()=>facts([['Phiếu công việc','CV-010 · PL-TC-018'],['Hiệu lực căn cứ',b('Đủ điều kiện triển khai')],['Ô mộ / huyệt','A-H01-04 · Huyệt 01'],['Người mất','Nguyễn Văn An · 1942–2026'],['Thời hạn công việc','10–15/10/2026'],['Yêu cầu','Hoàn thiện huyệt theo phụ lục']]);

screen('P01','P','Trang chủ & tra cứu nhanh','UC-1.4','Lối vào công khai, không yêu cầu tài khoản.',()=>`<div class="hero"><div><div class="eyebrow">CỔNG THÔNG TIN THÂN NHÂN</div><h1>Tìm đúng nơi.<br>Trọn vẹn tưởng nhớ.</h1><p>Tra cứu phần mộ, xem vị trí và thông tin chăm sóc đã được công bố trước mỗi chuyến thăm.</p><form class="searchbox" onsubmit="publicSearch(event)"><input aria-label="Tên người mất hoặc mã ô mộ" name="q" placeholder="Tên người mất hoặc mã ô mộ"><button class="btn primary">Tra cứu →</button></form><small>Có thể tìm bằng mã ô mộ, ví dụ A-H01-04.</small></div><div class="hero-art">${map(false)}</div></div><div class="grid three">${card('Tra cứu phần mộ','<p class="muted">Tìm theo họ tên, năm mất hoặc khu vực.</p>'+link('P02','Bắt đầu tra cứu →'))}${card('Chuẩn bị thăm viếng','<p class="muted">Xem hướng dẫn tìm vị trí và hỗ trợ tại cổng.</p>'+link('P04','Xem hướng dẫn →'))}${card('Thông tin chăm sóc','<p class="muted">Xem kết quả đã công bố tại chi tiết phần mộ.</p>'+link('P03','Xem phần mộ mẫu →'))}</div>`,['P02','P03','P04']);
screen('P02','P','Tra cứu phần mộ','UC-1.4','Phân biệt người trùng tên bằng năm mất, quê quán và vị trí.',()=>`${head('Tra cứu phần mộ','Tìm người thân theo thông tin đã được công bố.')}<form class="card" onsubmit="publicSearch(event)"><div class="fields">${field('Họ tên người mất hoặc mã ô mộ',ui.search,'text','name="q" placeholder="Nguyễn Văn An"')}${select('Năm mất',['Tất cả','2026','2024'],'name="year"')}${select('Phân khu',['Tất cả','Khu A','Khu B'],'name="zone"')}${field('Quê quán','','text','name="town" placeholder="Nhập quê quán"')}</div><div class="bottom-actions"><small>Chỉ hiển thị hồ sơ được công bố.</small><button class="btn primary">Tìm phần mộ</button></div></form><div class="card-head"><h2 id="result-title">2 kết quả minh họa</h2><small>Chọn đúng năm mất và quê quán</small></div><div class="grid" id="public-results">${publicResult('Nguyễn Văn An','1942 – 2026','Bình Dương','A-H01-04')}${publicResult('Nguyễn Văn An','1938 – 2024','Đồng Nai','B-H02-08')}</div>`,['P03']);
function publicResult(name,years,town,plot){return `<article class="memorial-card" data-search="${name} ${years} ${town} ${plot}"><div class="memorial-icon">✧</div><div><h2>${name}</h2><p>${years} · Quê quán: ${town}</p><p><strong>${plot}</strong> · Huyệt 01</p><a href="#P03" onclick="ui.person=this.closest('article').dataset.search.includes('B-H02')?'B':'A'">Xem phần mộ →</a></div></article>`}

function sidebar(){return `<aside class="sidebar">${brand()}<div class="nav-caption">${R[ui.role].toUpperCase()}</div><nav>${menus[ui.role].map(([id,t],i)=>`<a href="#${id}" class="navitem ${id===ui.id?'active':''}"><span class="navicon">${['◈','▦','▤','▧','◷','◇','☷'][i%7]}</span>${t}</a>`).join('')}</nav><div class="sidebar-bottom"><a href="#A02" class="navitem">Tài khoản cá nhân</a><a href="#P01" class="navitem">Đăng xuất · Về cổng tra cứu</a><div class="usercard"><span class="avatar">${ui.role==='Q'?'QT':ui.role==='M'?'MK':ui.role==='K'?'KT':'BQ'}</span><div><strong style="font-size:12px">Nhân viên mẫu</strong><small style="display:block">${R[ui.role]}</small></div></div></div></aside>`}

function stateView(){if(ui.state==='loading')return `${head('Đang tải thông tin','Vui lòng chờ trong giây lát.')}<div class="card" role="status">${Array.from({length:5},(_,i)=>`<div class="loading-line" style="width:${95-i*10}%"></div>`).join('')}</div>`;let forbidden=ui.state==='forbidden',empty=ui.state==='empty';return `<div class="empty" role="status"><div class="empty-icon">${forbidden?'⊘':empty?'⌕':'↻'}</div><h2>${forbidden?'Bạn không có quyền truy cập':empty?'Chưa có dữ liệu phù hợp':'Chưa thể tải thông tin'}</h2><p class="muted">${forbidden?'Chuyển về không gian công việc đúng vai trò.':empty?'Thử đổi từ khóa hoặc điều kiện lọc.':'Kiểm tra kết nối rồi thử lại. Nội dung đang nhập cần được giữ khi triển khai.'}</p>${btn(forbidden?'Về bàn làm việc':empty?'Xóa bộ lọc':'Thử lại',forbidden?`ui.state='normal';go('${ui.role}01')`:"ui.state='normal';render()",'primary')}</div>`}
function render(){let hash=decodeURIComponent(location.hash.slice(1)||'INDEX');if(hash==='INDEX'){document.getElementById('app').innerHTML=designbar()+catalogPage();document.title='44 màn hình · Thiết kế giao diện nghĩa trang';return}if(!screens[hash]){hash='Q01'}ui.id=hash;const s=screens[hash];if(s.role!=='A')ui.role=s.role;if(ui.role==='P'&&s.role==='A')ui.role='Q';let body=ui.state==='normal'?s.render():stateView();body+=`<div class="specnote"><details><summary>Ghi chú thiết kế · ${s.id} · ${s.uc}</summary><p>${s.desc}</p>${s.flow.length?`<div class="flowbar">${s.flow.map(id=>link(id,`${id} ${screens[id]?.title||''}`)).join('')}</div>`:''}<p>Đây là mẫu giao diện: dữ liệu và thao tác chỉ để xem luồng. Thanh chọn actor / trạng thái nằm ngoài sản phẩm thật. Phân quyền máy chủ chưa được triển khai trong bộ mẫu này.</p></details></div>`;let surface=s.role==='P'?publicShell(body):s.id==='A01'?publicShell(body):`<div class="workspace">${sidebar()}<div class="stage"><header class="appbar"><span>Không gian nội bộ / ${s.title}</span><div class="actions"><a href="#A03">Thông báo</a><a href="#A02">Tài khoản</a></div></header><main class="content">${body}</main>${mobileNav()}</div></div>`;document.getElementById('app').innerHTML=designbar()+`<div class="${ui.mobile?'mobile-preview':''}">${surface}</div>`;document.title=`${s.id} · ${s.title} | Thiết kế nghĩa trang`;updateGate();if(ui.id==='P02'&&ui.publicFilters)applyPublicFilters();}
function catalogPage(){return `<main class="catalog"><div class="catalog-header"><div><div class="eyebrow">THIẾT KẾ GIAO DIỆN / V1.0 / 10.10.2026</div><h1>Đúng người.<br>Đúng việc. Đúng luồng.</h1><p class="muted">44 màn hình cho 5 nhóm actor, đối chiếu 39 use case chi tiết trong Lab 2.</p><p style="max-width:800px">Bấm một màn hình để xem. Dùng thanh trên cùng để đổi actor, xem di động hoặc thử trạng thái lỗi / rỗng. Tất cả tên, số liệu, vị trí là dữ liệu minh họa.</p></div><div class="actions">${btn('Xem cổng thân nhân',"go('P01')",'primary')}${btn('Xem công việc quản trang',"go('Q01')")}</div></div>${notice('Bản thiết kế tập trung vào màn hình và luồng thao tác. Không kết nối backend, không đăng nhập thật, không gửi dữ liệu hoặc chứng từ ra ngoài.','blue')}<div class="grid three">${card('Hợp đồng',`<p>Nháp → In và ký ngoài hệ thống → Đính kèm bản đã ký → Có hiệu lực.</p><div class="flowbar">${['M05','M06','M07'].map(id=>link(id,id)).join('')}</div>`)}${card('Hiện trường',`<p>Căn cứ có hiệu lực → Checklist / lịch → Phân công → Ảnh & xác nhận.</p><div class="flowbar">${['Q02','Q03','Q04','Q05','Q08'].map(id=>link(id,id)).join('')}</div>`)}${card('Thu tiền',`<p>Nguồn nghĩa vụ → Khoản phải thu → Thực nhận → Biên lai → Doanh thu.</p><div class="flowbar">${['K02','K03','K05','K06'].map(id=>link(id,id)).join('')}</div>`)}</div>${['P','M','Q','K','S','A'].map(role=>`<div class="card-head"><h2>${R[role]}</h2><small>${Object.values(screens).filter(s=>s.role===role).length} màn hình</small></div><div class="screen-grid">${Object.values(screens).filter(s=>s.role===role).map(s=>`<a class="screen-card" href="#${s.id}"><div class="id">${s.id}</div><h3>${s.title}</h3><p>${s.desc}</p><small>${s.uc}</small></a>`).join('')}</div>`).join('')}<div class="card"><h2>Các quyết định thiết kế</h2><ul class="details-list"><li>Không vẽ bước duyệt trực tuyến cho Sếp: Lab 2–3 quy định ký ngoài hệ thống.</li><li>Quản trang dùng căn cứ tác nghiệp; không in hợp đồng, xem công nợ hoặc báo cáo doanh thu.</li><li>Thân nhân không đăng nhập. Chỉ xem hồ sơ và kết quả đã được công bố.</li><li>Marketing đăng ký gói; Quản trang lập lịch, phân công và xác nhận.</li><li>Kế toán chỉ xem báo cáo doanh thu; Sếp xem đủ bốn nhóm báo cáo.</li><li>Bản đồ là sơ đồ bố cục, không phải bản đồ GPS. Không dẫn đường đến tọa độ giả.</li></ul></div></main>`}

function filePicked(input,type){let f=input.files?.[0];if(!f)return;let allowed=type==='scan'?/\.(pdf|jpe?g|png)$/i:/\.(jpe?g|png)$/i;if(!allowed.test(f.name)){toast('Định dạng không phù hợp. Chọn đúng loại tệp được hướng dẫn.');input.value='';return}if(type==='scan')ui.signed=true;else ui.evidence=true;const x=input.parentElement.querySelector('#file-status');if(x)x.textContent=f.name+' · Đã chọn (mô phỏng tệp sẵn sàng)';updateGate()}
