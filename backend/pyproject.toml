[project]
name = "ql-nghiatrang-backend"
version = "0.2.0"
description = "Hệ thống Quản lý Nghĩa trang Tư nhân - Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "pyodbc>=5.2.0",
    "alembic>=1.14.0",
    "pyjwt[crypto]>=2.10.0",
    "pwdlib[argon2]>=0.2.0",
    "boto3>=1.35.0",
    "python-multipart>=0.0.18",
    "jinja2>=3.1.4",
    "openpyxl>=3.1.5",
    "email-validator>=2.0.0",
    "reportlab>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
